[package]
name = "dbconnector-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "stdio MCP server and tool routing for dbconnector"

[dependencies]
dbconnector-core.workspace = true
futures.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

dbconnector-sql = { workspace = true, optional = true }
dbconnector-mongo = { workspace = true, optional = true }
dbconnector-redis = { workspace = true, optional = true }

[features]
default = ["sql", "mongo", "redis"]
sql = ["dep:dbconnector-sql"]
mongo = ["dep:dbconnector-mongo"]
redis = ["dep:dbconnector-redis"]

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-child-process", "server", "transport-io"] }
tokio.workspace = true
serde_json.workspace = true
